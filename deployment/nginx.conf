# Production Nginx site configuration - Angels World School ERP
# Install as /etc/nginx/sites-available/angels-world-erp and symlink into sites-enabled.

limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream angels_world_erp {
    server 127.0.0.1:3000;
    keepalive 64;
}

# HTTP - Redirect all traffic to HTTPS secure protocols
server {
    listen 80;
    listen [::]:80;
    server_name erp.angels.edu.in;

    # Redirect to SSL
    return 301 https://$host$request_uri;
}

# HTTPS - Production secure proxy server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name erp.angels.edu.in;
    client_max_body_size 20m;

    # SSL Certificates (Let's Encrypt / Certbot paths)
    ssl_certificate /etc/letsencrypt/live/erp.angels.edu.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.angels.edu.in/privkey.pem;
    
    # SSL Optimizations (Security Headers & Cyphers)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Gzip Compression to minimize bandwidth and accelerate A5 PDF downloads
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_comp_level 5;
    gzip_buffers 16 8k;
    gzip_min_length 256;

    # Root proxy endpoint forward to Next.js node application (PM2 listening on 3000)
    location / {
        proxy_pass http://angels_world_erp;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static File Cache optimization (Next.js assets)
    location /_next/static {
        proxy_pass http://angels_world_erp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Rate Limiting configuration for API login routes (Brute force shield)
    location /api/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://angels_world_erp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Error logging handles
    error_log  /var/log/nginx/angels-world-erp-error.log error;
    access_log /var/log/nginx/angels-world-erp-access.log;
}
